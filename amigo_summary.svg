<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2415;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00e676;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00c853;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#112a18;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1f10;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)"/>

  <!-- Logo / Brand -->
  <text x="60" y="65" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="2">amigo</text>
  <rect x="60" y="72" width="80" height="2" fill="url(#accentGrad)" rx="1"/>

  <!-- Tagline -->
  <text x="600" y="55" font-size="18" fill="#00e676" text-anchor="middle" letter-spacing="6" font-weight="300">POPULATION HEALTH INTELLIGENCE</text>
  <text x="600" y="90" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">Predict. Prevent. Act.</text>
  <rect x="400" y="100" width="400" height="3" fill="url(#accentGrad)" rx="1"/>

  <!-- HIE badge -->
  <rect x="960" y="40" width="200" height="52" rx="8" fill="none" stroke="#00e676" stroke-width="1.5" opacity="0.6"/>
  <text x="1060" y="62" font-size="11" fill="#00e676" text-anchor="middle" letter-spacing="1">INTEGRATED WITH</text>
  <text x="1060" y="82" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">National HIE</text>

  <!-- ─── STATS ROW ─── -->
  <!-- Stat 1 -->
  <rect x="60" y="130" width="220" height="100" rx="12" fill="url(#cardGrad)" stroke="#00e676" stroke-width="1" stroke-opacity="0.3"/>
  <text x="170" y="178" font-size="38" font-weight="800" fill="#00e676" text-anchor="middle" filter="url(#glow)">22.2x</text>
  <text x="170" y="205" font-size="13" fill="#a0c4a8" text-anchor="middle">Return on Investment</text>

  <!-- Stat 2 -->
  <rect x="300" y="130" width="220" height="100" rx="12" fill="url(#cardGrad)" stroke="#00e676" stroke-width="1" stroke-opacity="0.3"/>
  <text x="410" y="178" font-size="38" font-weight="800" fill="#00e676" text-anchor="middle" filter="url(#glow)">6M+</text>
  <text x="410" y="205" font-size="13" fill="#a0c4a8" text-anchor="middle">Patient Interactions</text>

  <!-- Stat 3 -->
  <rect x="540" y="130" width="220" height="100" rx="12" fill="url(#cardGrad)" stroke="#00e676" stroke-width="1" stroke-opacity="0.3"/>
  <text x="650" y="178" font-size="38" font-weight="800" fill="#00e676" text-anchor="middle" filter="url(#glow)">6 wks</text>
  <text x="650" y="205" font-size="13" fill="#a0c4a8" text-anchor="middle">To Full Deployment</text>

  <!-- Stat 4 -->
  <rect x="780" y="130" width="220" height="100" rx="12" fill="url(#cardGrad)" stroke="#00e676" stroke-width="1" stroke-opacity="0.3"/>
  <text x="890" y="178" font-size="38" font-weight="800" fill="#00e676" text-anchor="middle" filter="url(#glow)">100%</text>
  <text x="890" y="205" font-size="13" fill="#a0c4a8" text-anchor="middle">Hospital Coverage</text>

  <!-- Stat 5 -->
  <rect x="1020" y="130" width="140" height="100" rx="12" fill="url(#cardGrad)" stroke="#00e676" stroke-width="1" stroke-opacity="0.3"/>
  <text x="1090" y="173" font-size="28" font-weight="800" fill="#00e676" text-anchor="middle" filter="url(#glow)">8</text>
  <text x="1090" y="195" font-size="11" fill="#a0c4a8" text-anchor="middle">Clinical Focus</text>
  <text x="1090" y="212" font-size="11" fill="#a0c4a8" text-anchor="middle">Areas</text>

  <!-- ─── AI AGENTS SECTION ─── -->
  <text x="60" y="278" font-size="14" fill="#00e676" letter-spacing="3" font-weight="600">AI AGENT ARCHITECTURE</text>

  <!-- Agent cards -->
  <!-- Agent 1: Observation -->
  <rect x="60" y="292" width="200" height="110" rx="10" fill="url(#cardGrad)" stroke="#00c853" stroke-width="1.5"/>
  <circle cx="90" cy="325" r="16" fill="#00c853" opacity="0.2"/>
  <text x="90" y="330" font-size="16" fill="#00e676" text-anchor="middle">◎</text>
  <text x="140" y="323" font-size="14" font-weight="700" fill="#ffffff">Observation</text>
  <text x="75" y="345" font-size="11" fill="#6a9a75">Live population</text>
  <text x="75" y="360" font-size="11" fill="#6a9a75">surveillance 24/7</text>
  <text x="75" y="385" font-size="10" fill="#00e676" font-style="italic">Real-time alerts</text>

  <!-- Agent 2: Risk -->
  <rect x="274" y="292" width="200" height="110" rx="10" fill="url(#cardGrad)" stroke="#00c853" stroke-width="1.5"/>
  <circle cx="304" cy="325" r="16" fill="#00c853" opacity="0.2"/>
  <text x="304" y="330" font-size="16" fill="#00e676" text-anchor="middle">⚡</text>
  <text x="354" y="323" font-size="14" font-weight="700" fill="#ffffff">Risk Stratification</text>
  <text x="289" y="345" font-size="11" fill="#6a9a75">Identify high-risk</text>
  <text x="289" y="360" font-size="11" fill="#6a9a75">patients before crisis</text>
  <text x="289" y="385" font-size="10" fill="#00e676" font-style="italic">Predictive scoring</text>

  <!-- Agent 3: Simulation -->
  <rect x="488" y="292" width="200" height="110" rx="10" fill="url(#cardGrad)" stroke="#00c853" stroke-width="1.5"/>
  <circle cx="518" cy="325" r="16" fill="#00c853" opacity="0.2"/>
  <text x="518" y="330" font-size="16" fill="#00e676" text-anchor="middle">⟳</text>
  <text x="568" y="323" font-size="14" font-weight="700" fill="#ffffff">Simulation</text>
