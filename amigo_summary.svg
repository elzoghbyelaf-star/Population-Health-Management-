  <text x="60" y="445" font-size="14" fill="#00e676" letter-spacing="3" font-weight="600">8 CLINICAL FOCUS AREAS</text>

  <rect x="60" y="458" width="130" height="36" rx="18" fill="#112a18" stroke="#00e676" stroke-width="1" stroke-opacity="0.5"/>
  <text x="125" y="481" font-size="12" fill="#ccf0d8" text-anchor="middle">Obesity</text>

  <rect x="204" y="458" width="130" height="36" rx="18" fill="#112a18" stroke="#00e676" stroke-width="1" stroke-opacity="0.5"/>
  <text x="269" y="481" font-size="12" fill="#ccf0d8" text-anchor="middle">Diabetes</text>

  <rect x="348" y="458" width="130" height="36" rx="18" fill="#112a18" stroke="#00e676" stroke-width="1" stroke-opacity="0.5"/>
  <text x="413" y="481" font-size="12" fill="#ccf0d8" text-anchor="middle">Hypertension</text>

  <rect x="492" y="458" width="150" height="36" rx="18" fill="#112a18" stroke="#00e676" stroke-width="1" stroke-opacity="0.5"/>
  <text x="567" y="481" font-size="12" fill="#ccf0d8" text-anchor="middle">Breast Cancer</text>

  <rect x="656" y="458" width="160" height="36" rx="18" fill="#112a18" stroke="#00e676" stroke-width="1" stroke-opacity="0.5"/>
  <text x="736" y="481" font-size="12" fill="#ccf0d8" text-anchor="middle">Cervical Cancer</text>

  <rect x="830" y="458" width="170" height="36" rx="18" fill="#112a18" stroke="#00e676" stroke-width="1" stroke-opacity="0.5"/>
  <text x="915" y="481" font-size="12" fill="#ccf0d8" text-anchor="middle">Colorectal Cancer</text>

  <rect x="60" y="504" width="150" height="36" rx="18" fill="#112a18" stroke="#00e676" stroke-width="1" stroke-opacity="0.5"/>
  <text x="135" y="527" font-size="12" fill="#ccf0d8" text-anchor="middle">Thyroid Cancer</text>

  <rect x="224" y="504" width="130" height="36" rx="18" fill="#112a18" stroke="#00e676" stroke-width="1" stroke-opacity="0.5"/>
  <text x="289" y="527" font-size="12" fill="#ccf0d8" text-anchor="middle">Fertility</text>

  <!-- ─── BOTTOM SECTION ─── -->
  <!-- Why Amigo -->
  <rect x="60" y="568" width="500" height="180" rx="14" fill="url(#cardGrad)" stroke="#00e676" stroke-width="1" stroke-opacity="0.2"/>
  <text x="90" y="598" font-size="14" font-weight="700" fill="#00e676" letter-spacing="2">WHY AMIGO</text>
  <text x="90" y="625" font-size="13" fill="#ccf0d8">✦  Not dashboards — AI agents that act</text>
  <text x="90" y="650" font-size="13" fill="#ccf0d8">✦  Built on billions of longitudinal health records</text>
  <text x="90" y="675" font-size="13" fill="#ccf0d8">✦  Clinical + administrative intelligence unified</text>
  <text x="90" y="700" font-size="13" fill="#ccf0d8">✦  NLP engine processing 2,000+ papers/month</text>
  <text x="90" y="725" font-size="13" fill="#ccf0d8">✦  Proven at scale — ready to expand nationally</text>

  <!-- Trust / Compliance -->
  <rect x="580" y="568" width="240" height="180" rx="14" fill="url(#cardGrad)" stroke="#00e676" stroke-width="1" stroke-opacity="0.2"/>
  <text x="610" y="598" font-size="14" font-weight="700" fill="#00e676" letter-spacing="2">COMPLIANCE</text>
  <text x="610" y="628" font-size="13" fill="#ccf0d8">🔒  SOC 2 Type II</text>
  <text x="610" y="655" font-size="13" fill="#ccf0d8">🔒  HIPAA Certified</text>
  <text x="610" y="682" font-size="13" fill="#ccf0d8">🔒  GDPR Compliant</text>
  <text x="610" y="709" font-size="13" fill="#ccf0d8">🔒  Local Data Residency</text>
  <text x="610" y="736" font-size="11" fill="#4a7a55">Backed by General Catalyst · Madrona</text>

  <!-- CTA -->
  <rect x="840" y="568" width="320" height="180" rx="14" fill="#0a2a12" stroke="#00e676" stroke-width="2"/>
  <text x="1000" y="615" font-size="14" fill="#a0c4a8" text-anchor="middle" letter-spacing="2">READY TO TRANSFORM</text>
  <text x="1000" y="645" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">National Population</text>
  <text x="1000" y="670" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">Health Outcomes</text>
  <rect x="880" y="690" width="240" height="40" rx="20" fill="url(#accentGrad)"/>
  <text x="1000" y="716" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Let's Meet →</text>
  <text x="1000" y="740" font-size="11" fill="#4a7a55" text-anchor="middle">elzoghby.elaf@amigo.ai</text>

  <!-- Bottom line -->
  <rect x="0" y="796" width="1200" height="4" fill="url(#accentGrad)"/>
</svg>
