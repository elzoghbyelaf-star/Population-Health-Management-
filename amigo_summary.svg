  <circle cx="946" cy="325" r="16" fill="#00c853" opacity="0.2"/>
  <text x="946" y="330" font-size="16" fill="#00e676" text-anchor="middle">♡</text>
  <text x="996" y="323" font-size="14" font-weight="700" fill="#ffffff">Patient Profile</text>
  <text x="931" y="345" font-size="11" fill="#6a9a75">360° longitudinal view</text>
